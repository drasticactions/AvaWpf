# Hand triage of WPF vs AvaWpf diffs, read by report.py (spec section 13).
#
# Each [[diff]] entry matches shots by scene, family, scheme and state. "*" matches anything; a trailing "*" matches
# a prefix ("checked*"). The first matching entry wins.
#
#   status = "accepted"  the difference is expected. Allowed reasons: see [accepted_reasons].
#   status = "bug"       AvaWpf must change. Everything that is not an accepted reason is a bug.
#
# Optional: max_percent = 1.5 accepts the diff only while the differing pixels stay at or below that percentage.
# Above it, the report shows the shot as a regression.
#
# Shots that no entry matches show as "untriaged" until somebody looks at them.
#
# The accepted reasons:
#   font hinting          Text rasterization. WPF under Wine draws through Wine's DirectWrite with grayscale
#                         smoothing and its own gamma; AvaWpf draws through Skia and HarfBuzz. Glyphs are darker and
#                         crisper on the WPF side, and the antialiasing differs on every text pixel. Includes the 1 px
#                         glyph advance differences that follow from it.
#   MS Sans Serif outline WPF draws outlines only, so the bitmap MS Sans Serif of some Classic schemes becomes an
#                         outline face (Tahoma on both sides here).
#   ClearType artifact    WPF's own antialiasing of geometry edges (circles, rounded corners, chevrons) versus
#                         Skia's.
#   layout rounding       Avalonia rounds every desired size up to the device pixel (LayoutHelper.RoundLayoutSizeUp);
#                         WPF rounds to the nearest pixel. Text-sized elements (tab headers, menu items, check box
#                         labels) are 1 px wider, and a centered control moves by 1 px. Not fixable in the themes.
#   animation phase       WPF captures a running theme animation at an arbitrary phase (the Aero default-button pulse,
#                         the Aero progress glow); AvaWpf renders the scenes with motion off.
#   font substitution     The snapshot asks for a font that neither side bundles (Times New Roman in Eggplant and Red,
#                         White and Blue). run.py gives WPF the fc-match face (Liberation Serif); Avalonia's font manager
#                         does not resolve the alias on the shooting host and draws its default face.

[accepted_reasons]
reasons = ["font hinting", "MS Sans Serif outline", "ClearType artifact", "layout rounding", "animation phase", "font substitution"]

