# Windows XP Dark: invented warm-grey surfaces for the Luna and Royale Dark variants. Each scheme then sets its
# own selection and caption colors.
name = "XP.Dark"
base = "xp-defaults"

[colors]
ActiveBorder = "#3A3936"
AppWorkspace = "#262624"
Control = "#3A3936"
ControlLightLight = "#5E5C57"
ControlLight = "#47463F"
ControlDark = "#262520"
ControlDarkDark = "#121210"
ControlText = "#F2F1EA"
Desktop = "#0F1A2B"
GrayText = "#8E8B80"
HighlightText = "#FFFFFF"
InactiveBorder = "#3A3936"
Info = "#3A3A30"
InfoText = "#F2F1EA"
Menu = "#2E2D2A"
MenuBar = "#3A3936"
MenuText = "#F2F1EA"
ScrollBar = "#2A2926"
Window = "#1F1E1C"
WindowFrame = "#000000"
WindowText = "#F2F1EA"
ActiveCaptionText = "#FFFFFF"
InactiveCaptionText = "#C8C6BE"
