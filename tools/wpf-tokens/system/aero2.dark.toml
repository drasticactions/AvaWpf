# Windows 10 Dark: invented (spec §7.6). Windows 10 dark mode keeps the classic SystemColors light, so these are
# hand-written from the Windows 10 dark mode surfaces (title bar and app background #202020, controls #2B2B2B).
name = "Aero2.Dark"
base = "aero2"

[colors]
ActiveBorder = "#3C3C3C"
ActiveCaption = "#202020"
ActiveCaptionText = "#FFFFFF"
AppWorkspace = "#1F1F1F"
Control = "#2B2B2B"
ControlLightLight = "#4A4A4A"
ControlLight = "#3A3A3A"
ControlDark = "#1E1E1E"
ControlDarkDark = "#101010"
ControlText = "#FFFFFF"
Desktop = "#000000"
GradientActiveCaption = "#202020"
GradientInactiveCaption = "#2B2B2B"
GrayText = "#8A8A8A"
Highlight = "#0078D7"
HighlightText = "#FFFFFF"
HotTrack = "#4CC2FF"
InactiveBorder = "#2B2B2B"
InactiveCaption = "#2B2B2B"
InactiveCaptionText = "#AAAAAA"
Info = "#2B2B2B"
InfoText = "#FFFFFF"
Menu = "#2B2B2B"
MenuBar = "#202020"
MenuHighlight = "#0078D7"
MenuText = "#FFFFFF"
ScrollBar = "#171717"
Window = "#202020"
WindowFrame = "#3C3C3C"
WindowText = "#FFFFFF"
