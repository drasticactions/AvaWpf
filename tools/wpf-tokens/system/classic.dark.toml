# Windows Classic Dark: invented (spec §7.4). A dark grey 3D face #3C3C3C; the 3D colors follow the classic rule:
# highlight = face + 25 % white, light = face, shadow = face - 33 %, dark shadow = black.
name = "Classic.Dark"
base = "Classic.WindowsStandard"

[colors]
Control = "#3C3C3C"
ControlLightLight = "#6D6D6D"
ControlLight = "#3C3C3C"
ControlDark = "#282828"
ControlDarkDark = "#000000"
ControlText = "#FFFFFF"
ActiveBorder = "#3C3C3C"
InactiveBorder = "#3C3C3C"
Menu = "#3C3C3C"
MenuBar = "#3C3C3C"
MenuText = "#FFFFFF"
Window = "#1E1E1E"
WindowText = "#FFFFFF"
WindowFrame = "#000000"
AppWorkspace = "#2A2A2A"
ScrollBar = "#2E2E2E"
GrayText = "#8C8C8C"
Highlight = "#2D5AA0"
HighlightText = "#FFFFFF"
MenuHighlight = "#2D5AA0"
Info = "#4A4A3A"
InfoText = "#FFFFFF"
HotTrack = "#8FB4F0"
ActiveCaption = "#0A246A"
GradientActiveCaption = "#3A6EA5"
InactiveCaption = "#505050"
GradientInactiveCaption = "#6A6A6A"
ActiveCaptionText = "#FFFFFF"
InactiveCaptionText = "#C8C8C8"
