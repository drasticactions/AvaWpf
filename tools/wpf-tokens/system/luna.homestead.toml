# Windows XP Luna Olive Green (luna.msstyles normalhomestead.ini) SystemColors, Light.
# Values marked normalhomestead.ini are the msstyles [SysMetrics] section (R G B), as listed in the author's palette notes;
# the rest are the Windows XP SP3 defaults, which the visual style does not override.
name = "Luna.Homestead"
base = "xp-defaults"

[colors]
Window = { value = "#FFFFFF", source = "normalhomestead.ini [SysMetrics]" }
MenuBar = { value = "#ECE9D8", source = "normalhomestead.ini [SysMetrics]" }
Menu = { value = "#FFFFFF", source = "normalhomestead.ini [SysMetrics]" }
Desktop = { value = "#9DACBD", source = "normalhomestead.ini [SysMetrics]" }
Control = { value = "#ECE9D8", source = "normalhomestead.ini [SysMetrics]" }
Highlight = { value = "#93A070", source = "normalhomestead.ini [SysMetrics]" }
ActiveCaption = { value = "#8BA169", source = "normalhomestead.ini [SysMetrics]" }
ActiveCaptionText = { value = "#FFFFFF", source = "normalhomestead.ini [SysMetrics]" }
InactiveCaption = { value = "#D4D6BA", source = "normalhomestead.ini [SysMetrics]" }
InactiveCaptionText = { value = "#FFFFFF", source = "normalhomestead.ini [SysMetrics]" }
GradientActiveCaption = { value = "#C6D2A2", source = "normalhomestead.ini [SysMetrics]" }
GradientInactiveCaption = { value = "#D4D6BA", source = "normalhomestead.ini [SysMetrics]" }
HighlightText = { value = "#FFFFFF", source = "normalhomestead.ini [SysMetrics]" }
MenuHighlight = { value = "#93A070", source = "normalhomestead.ini [SysMetrics]" }
ControlDark = { value = "#ACA899", source = "normalhomestead.ini [SysMetrics]" }
GrayText = { value = "#ACA899", source = "normalhomestead.ini [SysMetrics]" }
ControlLightLight = { value = "#FFFFFF", source = "normalhomestead.ini [SysMetrics]" }
ControlDarkDark = { value = "#716F64", source = "normalhomestead.ini [SysMetrics]" }
ControlLight = { value = "#F1EFE2", source = "normalhomestead.ini [SysMetrics]" }
