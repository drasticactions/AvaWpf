# Literal brushes of the Luna code-drawn chrome (AvaWpf.Chrome.Luna.*), from
# $W/Themes/PresentationFramework.Luna/Microsoft/Windows/Themes/{ButtonChrome,ScrollChrome,DataGridHeaderBorder}.cs and
# $W/Themes/Shared/Microsoft/Windows/Themes/BulletChrome.cs. Names follow the WPF Common* properties; a scheme segment
# (NormalColor, Homestead, Metallic) marks a brush WPF picks by ThemeColor. Pen thicknesses stay in code.
families = ["Luna"]

[light]
