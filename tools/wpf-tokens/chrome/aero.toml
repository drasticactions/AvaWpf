# Colors the Aero code-drawn chrome builds from literals in WPF
# ($W/Themes/PresentationFramework.Aero/Microsoft/Windows/Themes/*.cs; the Aero2 copies are identical).
# The Aero chrome classes (AvaWpf.Chrome.Aero.*) are used by both the Aero and the Aero2 templates.
# Keys ending in "Color" are the colors the code animations move to (WPF ColorAnimation targets).
families = ["Aero", "Aero2"]

[light]
# ButtonChrome
"ButtonChrome.Hover.Fill" = "linear 0,0 0,1 #FFEAF6FD@0 #FFD9F0FC@0.5 #FFBEE6FD@0.5 #FFA7D9F5@1"
