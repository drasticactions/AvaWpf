"ButtonChrome.Disabled.Fill" = "#FFF4F4F4"
"ButtonChrome.Hover.Border" = "#FF3C7FB1"
"ButtonChrome.Pressed.Border" = "#FF2C628B"
"ButtonChrome.Disabled.Border" = "#FFADB2B5"
"ButtonChrome.InnerBorder" = "linear 0,0 0,1 #FAFFFFFF@0 #85FFFFFF@1"
"ButtonChrome.Defaulted.InnerBorder" = "#F900CCFF"
"ButtonChrome.Pressed.LeftShadow" = "linear 0,0 1,0 #80333333@0 #00333333@1"
"ButtonChrome.Pressed.TopShadow" = "linear 0,0 0,1 #80333333@0 #00333333@1"
"ButtonChrome.Defaulted.InnerBorderColor" = "#F900CCFF"
"ButtonChrome.Pressed.Fill0Color" = "#FFC2E4F6"
"ButtonChrome.Pressed.Fill2Color" = "#FFABDAF3"
"ButtonChrome.Pressed.Fill3Color" = "#FF90CBEB"
