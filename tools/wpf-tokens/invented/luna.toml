# Layer 2 tokens of the Luna family: parts WPF does not draw.
# Keys become Luna.Invented.<key>.
#
# The window frame (WindowFrame) is a vector redraw of the Windows XP Luna frame. XP draws it from the theme bitmaps
# (FRAMECAPTION, FRAMELEFT/RIGHT/BOTTOM, CAPTIONBUTTON, CLOSEBUTTON of luna.msstyles), not from SystemColors, so the
# colors are sampled from those bitmaps: the caption is the 29-row FRAMECAPTION column, the frame sides the 5 px
# FRAMELEFT strip (outer edge, face, inner edge), the buttons the 21 x 21 cells. The invented tokens are per family,
# so each scheme has its own keys (WindowFrame.<Scheme>.*); the frame template picks them with the
# AvaWpf.ColorScheme resource.

[light]
"WindowFrame.CaptionHeight" = 28
"WindowFrame.ToolCaptionHeight" = 20
"WindowFrame.ButtonSize" = 21
"WindowFrame.ToolButtonSize" = 15
"WindowFrame.CornerRadius" = "radius 8,8,0,0"
"WindowFrame.CaptionCornerRadius" = "radius 7,7,0,0"
"WindowFrame.ButtonCornerRadius" = "radius 3"
"WindowFrame.MinimizeGlyph" = "geometry M 1 6 L 7 6 L 7 9 L 1 9 Z"
"WindowFrame.MaximizeGlyph" = "geometry F0 M 0 0 L 9 0 L 9 9 L 0 9 Z M 1 3 L 1 8 L 8 8 L 8 3 Z"
"WindowFrame.RestoreGlyph" = "geometry F0 M 3 0 L 9 0 L 9 6 L 8 6 L 8 2 L 4 2 L 4 3 L 3 3 Z M 0 3 L 6 3 L 6 9 L 0 9 Z M 1 5 L 1 8 L 5 8 L 5 5 Z"
"WindowFrame.CloseGlyph" = "geometry M 0 0 L 2 0 L 4.5 2.5 L 7 0 L 9 0 L 9 1 L 5.5 4.5 L 9 8 L 9 9 L 7 9 L 4.5 6.5 L 2 9 L 0 9 L 0 8 L 3.5 4.5 L 0 1 Z"

