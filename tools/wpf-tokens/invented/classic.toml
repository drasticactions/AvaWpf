# Layer 2 tokens of the Classic family: colors WPF writes as storyboard literals (which the extractor does not see)
# and parts WPF does not draw. Keys become Classic.Invented.<key>. Most Classic colors are SystemColors and need no
# token here.

[light]
# Shared CalendarDatePicker (avawpf-impl)
# DatePicker.xaml, [[Aero.NormalColor, Aero2.NormalColor, Luna.*, Royale.NormalColor, Classic]]: the colors the
# VisualStateManager storyboards of the drop-down button and DatePickerTextBox animate to. The extractor reads no
# storyboard values, so they are listed here under the element and property they animate, with the state last.
"DatePicker.DatePicker.Background.Background.MouseOver" = "#FF448DCA"
"DatePicker.DatePicker.Background.Background.Pressed" = "#FF448DCA"
"DatePicker.DatePicker.BackgroundGradient.Background.MouseOver" = "linear 0.7,0 0.7,1 #FFFFFFFF@0 #F2FFFFFF@0.375 #CCFFFFFF@0.625 #7FFFFFFF@1"
"DatePicker.DatePicker.BackgroundGradient.Background.Pressed" = "linear 0.7,0 0.7,1 #F4FFFFFF@0 #EAFFFFFF@0.375 #C6FFFFFF@0.625 #6BFFFFFF@1"
"DatePicker.DatePickerTextBox.ContentElement.BorderBrush.MouseOver" = "#FF99C1E2"
"DatePicker.DatePickerTextBox.watermark_decorator.BorderBrush.MouseOver" = "#FF99C1E2"

# Group B
# WPF Calendar.xaml [[Classic]]: the Inactive state of CalendarDayButton and CalendarButton animates the text to
# #FF777777 (a ColorAnimation literal).
"Calendar.InactiveText" = "#FF777777"

# Group C: invented controls.
# WPF's default Validation.ErrorTemplate frame (Brushes.Red).
"Validation.Error" = "#FFFF0000"
# The SplitView light-dismiss overlay over the content (40 % black).
"SplitView.LightDismissOverlay" = "#66000000"
# The Windows 2000 message-box icons in the tray balloon (NotificationCard): information blue, warning yellow,
# error red, the white glyph on blue/red, the black "!" on yellow and the dark outline.
"Notification.Information" = "#FF0000FF"
"Notification.Warning" = "#FFFFFF00"
"Notification.Error" = "#FFFF0000"
"Notification.Glyph" = "#FFFFFFFF"
"Notification.WarningGlyph" = "#FF000000"
"Notification.IconOutline" = "#FF000000"

# The Win98/2000 file dialog icons (ManagedFileChooser): the manila folder, the white page, the grey drive with its
# green light, the black up arrow and the black outline.
"FileChooser.Folder" = "#FFFFE680"
"FileChooser.Page" = "#FFFFFFFF"
"FileChooser.Drive" = "#FFC0C0C0"
"FileChooser.DriveLight" = "#FF00FF00"
"FileChooser.UpArrow" = "#FF000000"
"FileChooser.IconOutline" = "#FF000000"

# The calendar text and arrows: WPF draws them in ControlDarkDark, which is black in Classic Dark (black on dark),
# so Dark uses the control text color instead.
"Calendar.Text" = "{DynamicResource SystemColors.ControlDarkDarkColor}"


