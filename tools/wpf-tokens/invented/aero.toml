"ToggleSwitch.Track.On.Border" = "#FF3C7FB1"
"ToggleSwitch.Track.Disabled.Background" = "#FFF4F4F4"
"ToggleSwitch.Track.Disabled.Border" = "#FFADB2B5"
"ToggleSwitch.TrackCornerRadius" = "radius 9"

