"WindowFrame.Border.Background" = "#FFB9D1EA"
"WindowFrame.Border.Background.Inactive" = "#FFD7E4F2"
"WindowFrame.ClientEdge" = "#FF8DA2BE"
"WindowFrame.ClientEdge.Inactive" = "#FFAEBCCD"
"WindowFrame.Button.Background" = "linear 0,0 0,1 #FFF7F9FC@0 #FFE6EDF5@0.45 #FFCFDBEA@0.5 #FFDFE8F3@1"
"WindowFrame.Button.Hover.Background" = "linear 0,0 0,1 #FFEFF8FE@0 #FFCDEAFB@0.45 #FFA4D5F6@0.5 #FFC2E6F8@1"
"WindowFrame.Button.Pressed.Background" = "linear 0,0 0,1 #FFC4DDF2@0 #FF9EC8EA@0.45 #FF78AEDB@0.5 #FF93C2E6@1"
"WindowFrame.Button.Inactive.Background" = "linear 0,0 0,1 #FFF9FBFD@0 #FFEFF3F8@0.45 #FFE2E9F2@0.5 #FFEAF0F6@1"
"WindowFrame.Button.Border" = "#FF6D7F98"
"WindowFrame.Button.Border.Inactive" = "#FF9AA9BC"
"WindowFrame.Button.InnerHighlight" = "#90FFFFFF"
"WindowFrame.Button.Separator" = "#FF7D8EA6"
"WindowFrame.Close.Background" = "linear 0,0 0,1 #FFE9A99B@0 #FFD9806E@0.45 #FFC5533D@0.5 #FFD4735A@1"
"WindowFrame.Close.Hover.Background" = "linear 0,0 0,1 #FFF6C0B3@0 #FFEC8F7B@0.45 #FFDC4A31@0.5 #FFEB8267@1"
"WindowFrame.Close.Pressed.Background" = "linear 0,0 0,1 #FFC98575@0 #FFB45A47@0.45 #FF9A2E1C@0.5 #FFB25038@1"
"WindowFrame.Close.Border" = "#FF6E2B1F"
