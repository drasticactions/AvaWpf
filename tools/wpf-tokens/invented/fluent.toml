# Layer 2 tokens of the Fluent family: controls and parts WPF Fluent does not draw.
# Keys become Fluent.Invented.<key>. Colors that follow the variant come from WPF Fluent's own tokens in the templates;
# only Windows 11 values with no WPF Fluent token are listed here. The generator gives HighContrast the [light] table and
# Dark the whole [dark] table, so every key is listed in both.

[light]
# The Windows 11 window frame (WindowFrame): caption buttons 46 x 32, the close button turns #C42B1C with a white glyph
# on hover (90 % on press), and an 8 px-cornered window casts a soft shadow. Values from the Windows 11 (22H2) default
# frame.
"WindowFrame.CaptionHeight" = 32
"WindowFrame.ButtonWidth" = 46
"WindowFrame.Close.Hover.Background" = "#FFC42B1C"
"WindowFrame.Close.Pressed.Background" = "#E6C42B1C"
"WindowFrame.Close.Hover.Glyph" = "#FFFFFFFF"
"WindowFrame.Shadow" = "shadow 0 8 24 0 #42000000"
"WindowFrame.ShadowMargin" = "thickness 16,12,16,20"
# The Windows 11 toast (NotificationCard) shadow.
"NotificationCard.Shadow" = "shadow 0 8 16 0 #24000000"


