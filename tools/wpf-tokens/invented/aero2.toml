# Layer 2 tokens of the Aero2 family: controls and parts WPF does not draw.
# Keys become Aero2.Invented.<key>.

[light]
# The Windows 10 window frame (WindowFrame): a white caption, a 1 px border and flat 46 x 30 caption buttons with the
# red close hover. Values from the Windows 10 (1809+) default frame with "show accent color on title bars" off.
"WindowFrame.Caption.Background" = "#FFFFFFFF"
"WindowFrame.Caption.Foreground" = "#FF000000"
"WindowFrame.Caption.Inactive.Foreground" = "#FF999999"
"WindowFrame.Border" = "#FF1883D7"
"WindowFrame.Border.Inactive" = "#FFAAAAAA"
"WindowFrame.Button.Glyph" = "#FF000000"
"WindowFrame.Button.Glyph.Inactive" = "#FF999999"
"WindowFrame.Button.Hover.Background" = "#FFE5E5E5"
"WindowFrame.Button.Pressed.Background" = "#FFCCCCCC"
"WindowFrame.Button.Disabled.Glyph" = "#FFCCCCCC"
"WindowFrame.Close.Hover.Background" = "#FFE81123"
"WindowFrame.Close.Pressed.Background" = "#FFF1707A"
"WindowFrame.Close.Hover.Glyph" = "#FFFFFFFF"
"WindowFrame.Shadow" = "shadow 0 2 12 0 #59000000"
"WindowFrame.ShadowMargin" = "thickness 12"
"WindowFrame.CaptionHeight" = 30
"WindowFrame.ButtonWidth" = 46
"WindowFrame.MinimizeGlyph" = "geometry M 0 5.5 L 10 5.5"
"WindowFrame.MaximizeGlyph" = "geometry M 0.5 0.5 L 9.5 0.5 L 9.5 9.5 L 0.5 9.5 Z"
"WindowFrame.RestoreGlyph" = "geometry M 2.5 0.5 L 9.5 0.5 L 9.5 7.5 M 0.5 2.5 L 7.5 2.5 L 7.5 9.5 L 0.5 9.5 Z"
"WindowFrame.CloseGlyph" = "geometry M 0 0 L 10 10 M 10 0 L 0 10"
"WindowFrame.FullScreenGlyph" = "geometry M 0.5 3.5 L 0.5 0.5 L 3.5 0.5 M 6.5 0.5 L 9.5 0.5 L 9.5 3.5 M 9.5 6.5 L 9.5 9.5 L 6.5 9.5 M 3.5 9.5 L 0.5 9.5 L 0.5 6.5"
"WindowFrame.ExitFullScreenGlyph" = "geometry M 3.5 0.5 L 3.5 3.5 L 0.5 3.5 M 6.5 0.5 L 6.5 3.5 L 9.5 3.5 M 9.5 6.5 L 6.5 6.5 L 6.5 9.5 M 3.5 9.5 L 3.5 6.5 L 0.5 6.5"

# Calendar.xaml, [[Aero.NormalColor, Aero2.NormalColor, Luna.*, Royale.NormalColor]]: the colors the VisualStateManager
# storyboards animate to. The extractor reads no storyboard values, so they are listed here under the element and
# property they animate, with the state as the last part.
"Calendar.CalendarItem.path.Fill.MouseOver" = "#FF73A9D8"
"Calendar.CalendarItem.buttonContent.Foreground.MouseOver" = "#FF73A9D8"
"Calendar.CalendarDayButton.NormalText.Foreground.Inactive" = "#FF777777"
"Calendar.CalendarDayButton.NormalText.Foreground.Today" = "#FFFFFFFF"
"Calendar.CalendarButton.NormalText.Foreground.Inactive" = "#FF777777"

# DatePicker.xaml, [[Aero.NormalColor, Aero2.NormalColor, Luna.*, Royale.NormalColor, Classic]]: the colors the
# VisualStateManager storyboards of the drop-down button and DatePickerTextBox animate to. The extractor reads no
# storyboard values, so they are listed here under the element and property they animate, with the state last.
"DatePicker.DatePicker.Background.Background.MouseOver" = "#FF448DCA"
"DatePicker.DatePicker.Background.Background.Pressed" = "#FF448DCA"
"DatePicker.DatePicker.BackgroundGradient.Background.MouseOver" = "linear 0.7,0 0.7,1 #FFFFFFFF@0 #F2FFFFFF@0.375 #CCFFFFFF@0.625 #7FFFFFFF@1"
"DatePicker.DatePicker.BackgroundGradient.Background.Pressed" = "linear 0.7,0 0.7,1 #F4FFFFFF@0 #EAFFFFFF@0.375 #C6FFFFFF@0.625 #6BFFFFFF@1"
"DatePicker.DatePickerTextBox.ContentElement.BorderBrush.MouseOver" = "#FF99C1E2"
"DatePicker.DatePickerTextBox.watermark_decorator.BorderBrush.MouseOver" = "#FF99C1E2"

# ---------------------------------------------------------------------------------------------------------------------
# Invented looks: Avalonia controls WPF does not have (spec 7.9.1). Everything else they draw comes from the Aero2 WPF
# tokens and SystemColors; only what Aero2 has no part for is listed here.
# ---------------------------------------------------------------------------------------------------------------------

# DataValidationErrors: WPF's default Validation.ErrorTemplate (Validation.CreateDefaultErrorTemplate) is a 1 px Red
# border around the adorned element.
"Validation.ErrorBorder" = "#FFFF0000"

# NotificationCard: the Windows 10 toast, a square 1 px framed card with a soft shadow. Avalonia's severities show as a
# 4 px strip on the left edge in the Windows 10 status colors.
"Toast.Background" = "#FFF2F2F2"
"Toast.Border" = "#FFCCCCCC"
"Toast.Foreground" = "#FF000000"
"Toast.Message.Foreground" = "#FF4C4C4C"
"Toast.Shadow" = "shadow 0 2 10 0 #40000000"
"Toast.Information" = "#FF0078D7"
"Toast.Success" = "#FF107C10"
"Toast.Warning" = "#FFFFB900"
"Toast.Error" = "#FFE81123"

# Glyphs of the invented templates, drawn as 1 px strokes (Back, Menu, Refresh, Up) or fills (More) in a 14 px box.
"Glyph.Back" = "geometry M 6.5 0.5 L 0.5 6.5 L 6.5 12.5 M 0.5 6.5 L 14 6.5"
"Glyph.Menu" = "geometry M 0 1.5 L 14 1.5 M 0 6.5 L 14 6.5 M 0 11.5 L 14 11.5"
"Glyph.More" = "geometry M 0 5 L 2 5 L 2 7 L 0 7 Z M 6 5 L 8 5 L 8 7 L 6 7 Z M 12 5 L 14 5 L 14 7 L 12 7 Z"
"Glyph.Refresh" = "geometry M 11.5 3.5 A 5.5 5.5 0 1 0 12.5 7.5 M 12 0 L 12 4 L 8 4"
"Glyph.Up" = "geometry M 0.5 6.5 L 6.5 0.5 L 12.5 6.5 M 6.5 0.5 L 6.5 14"

# ManagedFileChooser icons: a Windows 8 manila folder, a white page with a folded corner and a gray drive.
"FileChooser.Folder.Data" = "geometry M 0.5 2.5 L 5.5 2.5 L 7 4 L 15.5 4 L 15.5 13.5 L 0.5 13.5 Z"
